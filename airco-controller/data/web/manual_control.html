<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AC Control - Airco Controller</title>
    <link rel="stylesheet" href="/css/water.min.css">
    <style>
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        .control-group {
            display: flex;
            flex-direction: column;
        }
        .control-group label {
            margin-bottom: 0.5rem;
            font-weight: bold;
        }
        .temp-control {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .temp-btn {
            width: 45px;
            height: 45px;
            font-size: 1.3rem;
            font-weight: bold;
        }
        .temp-display {
            font-size: 1.8rem;
            font-weight: bold;
            text-align: center;
            min-width: 70px;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }
        .checkbox-group input[type="checkbox"] {
            transform: scale(1.3);
        }
        .quick-actions {
            border: 1px solid var(--border);
            padding: 1.5rem;
            margin-top: 2rem;
        }
        .quick-actions h3 {
            margin-bottom: 1rem;
        }
        .quick-buttons {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .status {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 4px;
            font-weight: bold;
        }
        .status.success {
            background-color: #d4edda;
            color: #155724;
        }
        .status.error {
            background-color: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <nav style="padding: 1rem 0; margin-bottom: 2rem; border-bottom: 1px solid var(--border);">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2 style="margin: 0;">Airco Controller</h2>
            <div>
                <a href="/status" style="margin-right: 1rem;">Status</a>
                <a href="/api-keys" style="margin-right: 1rem;">API Keys</a>
                <a href="/control" style="margin-right: 1rem;">Control</a>
                <a href="/configure" style="margin-right: 1rem;">Configuration</a>
            </div>
        </div>
    </nav>

    <main style="max-width: 800px; margin: 0 auto; padding: 0 1rem;">
        <h1>AC Control</h1>
        
        <!-- AC Controls -->
        <div class="controls">
            <div class="control-group">
                <label>Mode</label>
                <select id="mode">
                    <option value="1">Cool</option>
                    <option value="2">Dry</option>
                    <option value="3">Fan</option>
                    <option value="4">Heat</option>
                </select>
            </div>
            
            <div class="control-group">
                <label>Fan Speed</label>
                <select id="fan">
                    <option value="0">Auto</option>
                    <option value="1">High</option>
                    <option value="2">Medium</option>
                    <option value="3">Low</option>
                    <option value="4">Quiet</option>
                </select>
            </div>
            
            <div class="control-group">
                <label>Temperature</label>
                <div class="temp-control">
                    <button class="btn temp-btn" id="temp-down">−</button>
                    <span class="temp-display" id="temp">22</span>°C
                    <button class="btn temp-btn" id="temp-up">+</button>
                </div>
            </div>
        </div>
        
        <!-- Swing Checkbox -->
        <div class="checkbox-group">
            <input type="checkbox" id="swing">
            <label for="swing">Swing</label>
        </div>

        <!-- Power Controls -->
        <div style="margin-top: 1.5rem;">
            <div style="display: flex; gap: 1rem; justify-content: center;">
                <button class="btn" id="on-btn" style="background-color: #28a745; color: white; padding: 0.75rem 1.5rem;">Turn ON</button>
                <button class="btn" id="off-btn" style="background-color: #dc3545; color: white; padding: 0.75rem 1.5rem;">Turn OFF</button>
                <button class="btn" id="powerful-toggle" style="background-color: #ff6b35; color: white; padding: 0.75rem 1.5rem;">Toggle Powerful</button>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="quick-actions">
            <h3>Quick Actions</h3>
            <div class="quick-buttons">
                <button class="btn" id="summer-mode">Summer Mode (Auto Cool 23°C)</button>
                <button class="btn" id="winter-mode">Winter Mode (Auto Heat 19°C)</button>
            </div>
        </div>

        <!-- Status Messages -->
        <div class="status" id="status" style="display: none;"></div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>
        $(document).ready(function() {
            // OFF button
            $('#off-btn').click(function() {
                $.post('/api/ir/off')
                    .done(function(response) {
                        showStatus('AC turned off', 'success');
                    })
                    .fail(function() {
                        showStatus('Failed to communicate with device', 'error');
                    });
            });

            // ON button - sends current settings
            $('#on-btn').click(function() {
                const mode = parseInt($('#mode').val());
                const temp = parseInt($('#temp').text());
                
                // Validate temperature ranges
                if (mode === 1 && (temp < 18 || temp > 30)) { // Cool mode
                    showStatus('Cool mode: temperature must be 18-30°C', 'error');
                    return;
                }
                if (mode === 4 && (temp < 16 || temp > 30)) { // Heat mode
                    showStatus('Heat mode: temperature must be 16-30°C', 'error');
                    return;
                }
                if ((mode === 2 || mode === 3) && (temp < 16 || temp > 30)) { // Dry/Fan mode
                    showStatus('Dry/Fan mode: temperature must be 16-30°C', 'error');
                    return;
                }
                
                const settings = {
                    mode: mode,
                    fanSpeed: parseInt($('#fan').val()),
                    temperature: temp,
                    swing: $('#swing').is(':checked') ? 1 : 0
                };
                
                console.log('Sending:', JSON.stringify(settings));
                
                $.ajax({
                    url: '/api/ir/on',
                    method: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(settings),
                    success: function(response) {
                        showStatus('AC turned on with current settings', 'success');
                    },
                    error: function(xhr) {
                        console.log('Error response:', xhr.responseText);
                        try {
                            const response = JSON.parse(xhr.responseText);
                            showStatus('Error: ' + response.error, 'error');
                        } catch (e) {
                            showStatus('Failed to communicate with device', 'error');
                        }
                    }
                });
            });

            // Temperature controls
            $('#temp-up').click(function() {
                const mode = parseInt($('#mode').val());
                const maxTemp = 30;
                let temp = parseInt($('#temp').text());
                
                if (temp < maxTemp) {
                    $('#temp').text(temp + 1);
                }
            });

            $('#temp-down').click(function() {
                const mode = parseInt($('#mode').val());
                const minTemp = mode === 1 ? 18 : 16; // Cool: 18°C, Heat/Dry/Fan: 16°C
                let temp = parseInt($('#temp').text());
                
                if (temp > minTemp) {
                    $('#temp').text(temp - 1);
                }
            });

            // Mode change - adjust temperature if needed
            $('#mode').change(function() {
                const mode = parseInt($(this).val());
                const temp = parseInt($('#temp').text());
                
                if (mode === 1 && temp < 18) { // Cool mode minimum
                    $('#temp').text(18);
                } else if (mode === 4 && temp < 16) { // Heat mode minimum
                    $('#temp').text(16);
                } else if ((mode === 2 || mode === 3) && temp < 16) { // Dry/Fan mode minimum
                    $('#temp').text(16);
                }
            });

            // Powerful toggle button
            $('#powerful-toggle').click(function() {
                $.ajax({
                    url: '/api/ir/toggle-powerful',
                    method: 'POST',
                    success: function(response) {
                        showStatus('Powerful mode toggled', 'success');
                    },
                    error: function(xhr) {
                        console.log('Powerful toggle error:', xhr.responseText);
                        try {
                            const response = JSON.parse(xhr.responseText);
                            showStatus('Error: ' + response.error, 'error');
                        } catch (e) {
                            showStatus('Failed to communicate with device', 'error');
                        }
                    }
                });
            });

            // Quick actions
            $('#summer-mode').click(function() {
                $('#mode').val('1'); // Cool
                $('#fan').val('0');  // Auto
                $('#temp').text('23');
                $('#swing').prop('checked', true); // Swing on
                
                const settings = {
                    mode: 1,
                    fanSpeed: 0,
                    temperature: 23,
                    swing: 1
                };
                
                $.post('/api/ir/on', settings)
                    .done(function(response) {
                        showStatus('Summer mode activated (Cool 23°C, Swing On)', 'success');
                    })
                    .fail(function() {
                        showStatus('Failed to activate summer mode', 'error');
                    });
            });

            $('#winter-mode').click(function() {
                $('#mode').val('4'); // Heat
                $('#fan').val('0');  // Auto
                $('#temp').text('19');
                $('#swing').prop('checked', true); // Swing on
                
                const settings = {
                    mode: 4,
                    fanSpeed: 0,
                    temperature: 19,
                    swing: 1
                };
                
                $.post('/api/ir/on', settings)
                    .done(function(response) {
                        showStatus('Winter mode activated (Heat 19°C, Swing On)', 'success');
                    })
                    .fail(function() {
                        showStatus('Failed to activate winter mode', 'error');
                    });
            });

            function showStatus(message, type) {
                const statusDiv = $('#status');
                statusDiv.removeClass('success error').addClass(type);
                statusDiv.text(message).show();
                setTimeout(() => statusDiv.fadeOut(), 4000);
            }
        });
    </script>
</body>
</html>
